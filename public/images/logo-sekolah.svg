<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134E4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer Pentagon Shield -->
  <polygon points="100,10 185,55 160,165 100,195 40,165 15,55" fill="url(#grad1)" stroke="url(#gold)" stroke-width="6" rx="4"/>
  <!-- Inner Shield border -->
  <polygon points="100,22 173,61 151,155 100,181 49,155 27,61" fill="#FFFFFF" opacity="0.95"/>
  <!-- Book Symbol -->
  <path d="M 60,120 Q 100,105 100,135 Q 100,105 140,120 L 140,85 Q 100,70 100,95 Q 100,70 60,85 Z" fill="url(#grad1)"/>
  <!-- Torch / Flame -->
  <path d="M 100,45 C 92,60 100,75 100,75 C 100,75 108,60 100,45 Z" fill="url(#gold)"/>
  <!-- Torch Handle -->
  <rect x="97" y="75" width="6" height="20" fill="#4B5563" rx="2"/>
  <!-- Star -->
  <polygon points="100,30 103,37 110,38 105,43 106,50 100,46 94,50 95,43 90,38 97,37" fill="url(#gold)"/>
  <!-- Text SMPN 3 -->
  <text x="100" y="162" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#0F766E">SMPN 3</text>
</svg>
